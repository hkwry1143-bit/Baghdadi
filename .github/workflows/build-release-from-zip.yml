name: Build Baghdadi Release APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build-release-from-zip.yml'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo 'No project ZIP found in repository.' >&2
            exit 1
          fi
          echo "zip_file=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted
          settings_file=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$settings_file" ]; then
            echo 'settings.gradle/settings.gradle.kts not found inside ZIP.' >&2
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$settings_file")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Collect APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          sha256sum "$apk" > release-apk.sha256
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baghdadi-Release-APK
          path: |
            ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.apk }}
            ${{ env.PROJECT_DIR }}/release-apk.sha256
          if-no-files-found: error
          retention-days: 30
